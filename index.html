<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#030512" />
    <meta
      name="description"
      content="MONETA — Twoje pieniądze. Twój spokój. Prywatny planer budżetu."
    />
    <title>MONETA — Twój finansowy spokój</title>
    <!-- Paint immediately, before the application bundle and local data load. -->
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        background: #030512;
        color: #f5f7ff;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        font:
          600 36px/1 system-ui,
          sans-serif;
        letter-spacing: -1.4px;
        animation: boot-arrive 450ms ease-out both;
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-right: 12px;
        border-radius: 16px;
        background: #f5f7ff;
        color: #030512;
        font:
          bold italic 46px/1 Georgia,
          serif;
        letter-spacing: -4px;
        padding-right: 4px;
        box-sizing: border-box;
      }
      .boot-period {
        color: #8aabff;
      }
      .boot-track {
        position: relative;
        width: 96px;
        height: 3px;
        overflow: hidden;
        border-radius: 4px;
        background: #222b48;
      }
      .boot-track::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          #8aabff,
          #9a82e2,
          transparent
        );
        animation: boot-shimmer 1.2s ease-in-out infinite;
      }
      @keyframes boot-arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes boot-shimmer {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-track::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-label="Ładowanie MONETA">
        <div class="boot-brand" aria-hidden="true">
          <span class="boot-mark">m</span>moneta<span class="boot-period"
            >.</span
          >
        </div>
        <span class="boot-track" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
